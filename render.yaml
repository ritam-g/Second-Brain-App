services:
  # ────────────────────────────────────────────────────────────────────────────
  # SINGLE SERVICE DEPLOYMENT (Backend + Frontend together)
  # The Backend server will serve the built Frontend "dist" folder.
  # ────────────────────────────────────────────────────────────────────────────
  - type: web
    name: second-brain-app
    runtime: node
    rootDir: second-brain-backend
    
    # 1. Install backend deps
    # 2. Go to frontend, install deps, and build (creates dist folder)
    # 3. Backend will serve that dist folder
    buildCommand: npm install && cd ../second-brain-frontend && npm install && npm run build
    
    startCommand: node server.js
    
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      
      # ── REQUIRED SECRETS (Set these in Render Dashboard) ──
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: PINECONE_HOST
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      
      # For a single service, the backend URL is the frontend URL.
      # VITE_API_URL should point to the /api of YOUR RENDER APP.
      - key: VITE_API_URL
        sync: false
