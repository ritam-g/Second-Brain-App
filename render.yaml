services:
  # ────────────────────────────────────────────────────────────────────────────
  # MODERN SINGLE-SERVICE DEPLOYMENT
  # The Backend server will serve the built Frontend "dist" folder.
  # ────────────────────────────────────────────────────────────────────────────
  - type: web
    name: second-brain-app
    runtime: node
    
    # ROOT IS NOW THE ACTUAL REPO ROOT (no more rootDir: second-brain-backend)
    # This solves all path issues with sibling folders.
    buildCommand: npm run build
    startCommand: npm run start
    
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      
      # ── REQUIRED SECRETS (Set these in Render Dashboard) ──
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: PINECONE_HOST
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      
      # Since it's one domain, point both to your Render URL.
      # e.g. https://your-app.onrender.com/api
      - key: VITE_API_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
